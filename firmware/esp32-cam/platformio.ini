[platformio]
; O código fica na pasta do sketch para existir uma cópia só (Arduino IDE e PlatformIO).
src_dir = arduino/helios_cam

[env:esp32cam]
platform = espressif32@6.7.0
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
